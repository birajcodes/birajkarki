name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `app/layout.tsx` uses Next.js's generated `LayoutProps<...>` type
      # (ambient, from .next/types) instead of a hand-written prop type —
      # that's the standard App Router pattern, but it means the ambient
      # type doesn't exist yet on a clean checkout until it's generated.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present

      - name: Production build
        run: npm run build
